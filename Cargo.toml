[workspace]
members = [
    "apps/sysop-bbs-tui",
    "crates/bbs_core",
    "crates/bbs_sandbox",
]
resolver = "2"

[workspace.package]
edition = "2021"
authors = ["FloatCtl Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
bbs_core = { path = "crates/bbs_core" }
bbs_sandbox = { path = "crates/bbs_sandbox" }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.27"
ratatui = "0.26"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
