[package]
name = "fieldguide-tui"
version = "0.2.0"
edition = "2021"

[dependencies]
anyhow = "1.0.89"
bitflags = "2.6.0"
log = "0.4.22"
env_logger = "0.11.5"
ratatui = { version = "0.28.0", default-features = false, features = ["crossterm"] }
crossterm = "0.28.1"
tokio = { version = "1.39.2", features = ["rt-multi-thread", "macros"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
thiserror = "1.0.63"
rmcp = { version = "0.7.0", features = ["server", "macros", "transport-io"] }
crossbeam-channel = "0.5.12"
toml = "0.8.19"

[dev-dependencies]
insta = "1.39.0"
ratatui = { version = "0.28.0", default-features = false, features = ["crossterm"] }
