[package]
name = "bbs_core"
version = "0.1.0"
edition = "2021"
description = "Core data model and utilities for the FloatCtl BBS TUI"
license = "MIT OR Apache-2.0"
repository = "https://example.com/floatctl"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
ratatui = "0.26"
indexmap = "2.1"

[dev-dependencies]
tempfile = "3.10"
